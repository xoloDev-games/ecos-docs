<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#1B2230"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Clean inner echo -->
  <circle cx="512" cy="512" r="206" fill="none" stroke="#26A69A" stroke-width="26" opacity="0.95"/>
  <circle cx="512" cy="512" r="294" fill="none" stroke="#F2E6D0" stroke-width="18" opacity="0.35"/>

  <!-- Degrading outer echo: solid on the left, fragmented on the right -->
  <path d="M 512 136 A 376 376 0 0 0 210 690" fill="none" stroke="url(#ember)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 796 674 A 376 376 0 0 0 824 484" fill="none" stroke="#C9A227" stroke-width="24" stroke-linecap="round"/>
  <path d="M 760 760 A 376 376 0 0 1 720 800" fill="none" stroke="#E4572E" stroke-width="22" stroke-linecap="round"/>

  <!-- Fragments: the rumor breaking apart -->
  <path d="M 850 540 L 920 518 L 884 594 Z" fill="#E4572E"/>
  <path d="M 820 640 L 900 638 L 852 700 Z" fill="#C9A227"/>
  <path d="M 742 742 L 806 776 L 732 806 Z" fill="#F2E6D0" opacity="0.75"/>

  <!-- Central mouth / whisper -->
  <circle cx="512" cy="512" r="132" fill="#F2E6D0"/>
  <path d="M 432 522 Q 512 446 592 522 Q 512 598 432 522 Z" fill="#10131A"/>
  <path d="M 470 522 Q 512 492 554 522 Q 512 552 470 522 Z" fill="#E4572E"/>
  <circle cx="512" cy="522" r="18" fill="#10131A"/>

  <!-- Small sound ticks -->
  <path d="M 620 470 L 672 444" stroke="#10131A" stroke-width="16" stroke-linecap="round"/>
  <path d="M 628 512 L 696 512" stroke="#10131A" stroke-width="16" stroke-linecap="round"/>
  <path d="M 620 554 L 672 580" stroke="#10131A" stroke-width="16" stroke-linecap="round"/>
</svg>
